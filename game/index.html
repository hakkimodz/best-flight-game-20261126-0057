<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merapi Ridge Run — fly the volcanic island</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a141f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Merapi Ridge Run: fly a prop plane over a volcanic island, through sky rings, and land back on the runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { Game } from './src/main.js';
  new Game(document.getElementById('game'));
</script>
</body>
</html>
